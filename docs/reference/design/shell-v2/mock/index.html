function price(parts, cls = "", attrs = "", check = true) {
  const short = check && parts.some((x) => x !== "or" && RES[x[1]]) && !affordable(parts);
  const body = parts.map((x) => (x === "or" ? `<span class="price-or">·</span>` : `<span>${x[0]}</span>${ico(RES_IC[x[1]], "chip")}`)).join("");
  return `<span class="price${cls ? " " + cls : ""}${short ? " is-short" : ""}"${attrs}>${body}</span>`;
}
/* a tooltip ledger: [label, value, icon?] rows */
const ledger = (rows) => `<div class="tip-ledger">${rows.map(([k, v, ic]) => `<span class="tip-k">${ic ? ico(ic, "chip") : ""}${k}</span><b>${v}</b>`).join("")}</div>`;
const warn = (text) => `<div class="tip-warn">${ico("unrest/alarm", "chip")}${text}</div>`;
const censusRows = (c) => [["Slaves", c.s, POP_IC.s], ["Freemen", c.f, POP_IC.f], ["Citizens", c.c, POP_IC.c]];

/* Tooltip bodies, keyed by data-tip. Each is { title, sub, body } with HTML. */
const TIPS = {};
const tipText = (title, body, sub = "") => ({ title, sub, body: body ? `<p class="tip-body">${body}</p>` : "" });

/* ------------------------------------------------------------- top bar ---- */
function topbar() {
  TIPS.year = tipText(`Year ${roman(YEAR.n)}`, `Year ${roman(YEAR.n)} of ${roman(YEAR.of)}. ${YEAR.left} cards left in the year deck; the next lies face-down.`, "The year deck");
  TIPS.card = tipText(YEAR.card, `${YEAR.rule} PYLOS stands on plains.`, "This year's card");
  const clock = `<div class="clock" data-c="clock">
    <div class="year" data-c="year" tabindex="0" data-tip="year" data-tip-at="below"><span class="year-n">Year ${roman(YEAR.n)}</span><span class="year-of">of ${roman(YEAR.of)}</span></div>
    <button class="yearcard" data-c="yearcard" data-tip="card" data-tip-at="below" aria-label="This year's card: ${YEAR.card}. ${YEAR.rule}"><span class="yearcard-name">${YEAR.card}</span><span class="yearcard-rule">${ico("terrain/plains", "ui")}${ico("pops/slaves", "ui")}<span class="yearcard-x">×0</span></span></button>
  </div>`;
  const res = Object.entries(RES).map(([k, [v, d]]) => {
    const short = v + d < 0;
    TIPS["res-" + k] = tipText(cap(k), `${v} in store, ${sign(d)} next year.${short ? " Short: one pop leaves unless you buy food, take the Dole, or move a mouth." : ""}`, "Resource");
    return `<div class="res${short ? " is-short" : ""}" data-c="res" tabindex="0" data-tip="res-${k}" data-tip-at="below" aria-label="${cap(k)} ${v}, ${sign(d)} next year${short ? ", short" : ""}">${ico(RES_IC[k], "ui")}<span class="res-val num">${v}</span><span class="res-delta ${tone(d)}">${sign(d)}</span></div>`;
  }).join("");
  const riot = LEVEL.v <= LEVEL.riot;
  TIPS.level = { title: `Level ${sign(LEVEL.v)}`, sub: "Riot at −3 · revolt at −6", body: `<div class="tip-ledger">${LEVEL.lines.map(([k, v]) => `<span>${k}</span><b>${sign(v)}</b>`).join("")}<span class="is-total">Level</span><b class="is-total">${sign(LEVEL.v)}</b></div>` };
  const level = `<div class="level${riot ? " is-riot" : ""}" data-c="level" tabindex="0" data-tip="level" data-tip-at="below" aria-label="Level ${sign(LEVEL.v)}; riot at −3, revolt at −6">${ico(RES_IC.happiness, "ui")}<span class="res-val num ${tone(LEVEL.v)}">${sign(LEVEL.v)}</span><span class="gauge" style="--level:${LEVEL.v}"></span></div>`;
  const consult = CONSULT.map(([k, n, gl, t]) => { TIPS["c-" + k] = tipText(n, t, "Consult"); return `<button class="consult-btn" data-c="consult-btn" data-tip="c-${k}" data-tip-at="below" aria-label="${n}">${ico(gl, "ui")}</button>`; }).join("");
  const rivals = ROSTER.map((r) => {
    const [gz, tok, letter, ink] = GLAZE[r.id]; const c = census(r.id);
    TIPS["r-" + r.id] = {
      title: NAMES[r.id], sub: gz + (r.id === ME ? " · acting" : ""),
      body: ledger([...censusRows(c), ["Cities", c.cities, "settlements/city"], ["Colonies", c.colonies, "settlements/colony"]])
        + (r.threat ? warn("One condition from a third card") : ""),
    };
    return `<button class="rival${r.id === ME ? " is-acting" : ""}${r.threat ? " is-threat" : ""}" data-c="rival" style="--owner:var(--${tok});--owner-ink:var(--${ink})" data-tip="r-${r.id}" data-tip-at="below"${r.threat ? ' data-gate-hover="rival"' : ""} aria-label="${NAMES[r.id]}${r.id === ME ? ", acting" : ""}${r.threat ? ", one condition from a third card" : ""}"><span class="rival-disc">${letter}</span></button>`;
  }).join("");
  document.getElementById("topbar").innerHTML = `${clock}<div class="purse" data-c="purse">${res}${level}</div><div class="court" data-c="court"><nav class="consult" data-c="consult" aria-label="Consult">${consult}</nav><div class="rivals" data-c="rivals" role="group" aria-label="Rulers">${rivals}</div></div>`;
}

/* The current line stands alone; the year column appears in the history below it. */
function ticker() {
  const [[, line], ...rest] = CHRONICLE;
  document.getElementById("ticker").innerHTML = `<span class="ticker-line">${line}</span><ol class="ticker-more" data-gate-skip>${rest.map(([yy, l]) => `<li><span class="ticker-year">${yy}</span><span>${l}</span></li>`).join("")}</ol>`;
}

/* ---------------------------------------------------------- realm sheet ----
   p-ledger-r3's sheet: six verb groups ride its edge; DISCS sets their order,
   and with it their hotkeys 1 to 6. Every fan lists all of its group's
   options, the one a disc click runs included. `click` names that option; a
   group without one opens its fan on a click. An option with `items` holds a
   second fan. An option pays `price` and may receive `get`; `text` stands in
   for a price where there is none. While a fan is open, the name under the
   disc gives way to `hint` (and the click's price). To give the sixth disc
   (Grow) other content, point its DISCS entry at another group. */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const nums = (s) => esc(s).replace(/(\d+)/g, "<b>$1</b>");
const argosBuilt = () => settleAt(SUBJECT).built;
const buildings = (...ids) => ids.map((id) => ({ id, n: BUILDINGS[id].n, ic: BUILDINGS[id].ic, price: BUILDINGS[id].price, built: argosBuilt().includes(id) }));
const GROUPS = {
  grow: {
    n: "Grow", ic: "pops/pop-gain", click: "grow-slave", hint: "Slave",
    items: [
      { id: "grow-slave", n: "Slave", ic: POP_IC.s, price: [["2", "food"]] },
      { id: "grow-freeman", n: "Freeman", ic: POP_IC.f, price: [["3", "food"]] },
    ],
  },
  people: {
    n: "People", ic: "pops/crowd", click: null, hint: "Pick one",
    items: [
      { id: "promote", n: "Promote", ic: "pops/promote", price: [["2", "gold"]] },
      { id: "demote", n: "Demote", ic: "pops/demote", price: [["1", "influence"]] },
      { id: "move", n: "Move", ic: "pops/move", price: [["1", "food"]] },
    ],
  },
  expand: {
    n: "Expand", ic: "settlements/found", left: PIECES.colony[0], click: "found", hint: "Found",
    items: [
      { id: "found", n: "Found a colony", ic: "settlements/found", price: [["4", "wood"], ["1", "food"]], left: PIECES.colony[0], note: `${PIECES.colony[0]} of ${PIECES.colony[1]} colonies left` },
      { id: "upgrade", n: "Upgrade to a city", ic: "settlements/upgrade", price: [["3", "wood"], ["3", "stone"]], left: PIECES.city[0], note: `${PIECES.city[0]} of ${PIECES.city[1]} cities left` },
    ],
  },
  build: {
    n: "Build", ic: "buildings/build", click: null, hint: "Pick a class",
    items: [
      { id: "build-slaves", n: "Slaves", ic: POP_IC.s, text: "Estate", items: buildings("estate") },
      { id: "build-freemen", n: "Freemen", ic: POP_IC.f, text: "Marketplace", items: buildings("marketplace") },
      { id: "build-citizens", n: "Citizens", ic: POP_IC.c, text: "Forum", items: buildings("forum") },
      { id: "build-civic", n: "Civic", ic: "settlements/capital", text: "3 buildings", items: buildings("temple", "granary", "port") },
    ],
  },
  civic: {
    n: "Civic", ic: "unrest/calm-verb", click: "calm-gold", hint: "Calm",
    items: [
      { id: "calm-gold", n: "Calm", ic: "unrest/calm-verb", price: [["2", "gold"]], note: "+2 level until your next turn" },
      { id: "calm-influence", n: "Calm", ic: "unrest/patronage", price: [["2", "influence"]], note: "+2 level until your next turn" },
      { id: "dole", n: "Dole", ic: "unrest/bread-dole", price: [["3", "influence"]], get: [["1", "food"]] },
      { id: "venture", n: "Venture", ic: "events/venture", price: [["2", "gold"]] },
    ],
  },
  exchange: {
    n: "Exchange", ic: "market/bank", click: null, hint: "Pick a good",
    items: ["wood", "stone", "food"].map((r) => ({
      id: r, n: cap(r), ic: RES_IC[r], text: `${RES[r][0]} in store`,
      items: [
        { id: `buy-${r}`, n: "Buy 1", ic: `market/buy-${r}`, price: [["2", "gold"]], get: [["1", r]] },
        { id: `sell-${r}`, n: "Sell 3", ic: `market/sell-${r}`, price: [["3", r]], get: [["1", "gold"]] },
      ],
    })),
  },
};
const DISCS = ["grow", "people", "expand", "build", "civic", "exchange"];
/* what an option costs, shown as chips and said as words */
const pay = (it) => `${price(it.price)}${it.get ? `<span class="price-or">▸</span>${price(it.get, "", "", false)}` : ""}`;
const say = (it) => it.text || `${words(it.price)}${it.get ? ` for ${words(it.get)}` : ""}`;

/* one fan: a menu of sub-circles; an option with `items` nests its own */
function fan(id, label, items) {
  const lis = items.map((it, k) => {
    const sub = it.items;
    const off = !sub && (it.built || !affordable(it.price));
    const state = it.built ? " is-built" : off ? " is-short" : "";
    const shown = it.built ? "built here" : it.text ? nums(it.text) : pay(it);
    const spoken = it.built ? "built here" : say(it);
    const opens = sub ? ` aria-haspopup="menu" aria-expanded="false" aria-controls="fan-${it.id}"` : "";
    return `
        <li class="fan-item${state}" style="--k: ${k}" role="none">
          <button class="fan-btn" role="menuitem" tabindex="-1" data-verb="${it.id}"${opens}${off ? ' aria-disabled="true"' : ""} aria-label="${esc(`${it.n}, ${spoken}${it.note ? `, ${it.note}` : ""}`)}">
            <span class="fan-disc">${ico(it.ic, "tile")}${it.left ? `<span class="verb-count" aria-hidden="true">${it.left}</span>` : ""}</span>
            <span class="fan-label"><span class="fan-k">${esc(it.n)}</span><span class="fan-p">${shown}</span></span>
          </button>${sub ? fan(`fan-${it.id}`, it.n, sub) : ""}
        </li>`;
  }).join("");
  return `<ul class="fan" id="${id}" role="menu" aria-label="${esc(label)}" data-gate-skip>${lis}</ul>`;
}
/* the gate's hover shots: a fan, a second-level fan, and Exchange's second level */
const HOVER = {
  build: { disc: "fan", name: "fan-2", next: '[data-verb="build-freemen"]' },
  exchange: { name: "exchange", next: '[data-verb="wood"]' },
};
function verbs() {
  const shot = (name, next) => ` data-gate-hover="${name}" data-gate-hover-wait="800"${next ? ` data-gate-hover-next="${esc(next)}"` : ""}`;
  return DISCS.map((gid, i) => {
    const g = GROUPS[gid];
    const key = String(i + 1);
    const p = g.click && g.items.find((it) => it.id === g.click);
    const short = p && !affordable(p.price);
    const label = p ? `${g.n}: ${p.n}, ${say(p)}. Enter for more.` : `${g.n}: pick one`;
    const h = HOVER[gid] || {};
    return `
      <li class="verb${short ? " is-short" : ""}" data-c="verb" data-group="${gid}" style="--i: ${i}">
        <button class="verb-btn" aria-keyshortcuts="${key}" aria-haspopup="menu" aria-expanded="false" aria-controls="fan-${gid}" aria-label="${esc(label)}"${short ? ' aria-disabled="true"' : ""}>
          <span class="verb-disc" data-c="verb-disc" data-exclude${h.disc ? shot(h.disc) : ""}>${ico(g.ic, "disc")}<span class="verb-key" aria-hidden="true">${key}</span>${g.left ? `<span class="verb-count" aria-hidden="true">${g.left}</span>` : ""}</span>
          <span class="verb-name" data-c="verb-name" data-exclude${h.name ? shot(h.name, h.next) : ""}><span class="verb-name-k">${g.n}</span><span class="verb-name-p">${g.hint}${p ? pay(p) : ""}</span></span>
        </button>
        ${fan(`fan-${gid}`, g.n, g.items)}
      </li>`;
  }).join("");
}

/* the subject settlement: meta line, three pop columns, building lines */
function settlementPage(s) {
  const t = tileOf(s.tile);
  const y = yieldOf(s);
  const slots = SLOTS[s.rank] ?? t.slots;
  const pops = s.pops.s + s.pops.f + s.pops.c;
  const open = slots - s.built.length;
  const chip = (k) => ico(RES_IC[k], "chip");
  const slaveYield = y.s.zero ? `<b>0</b>${chip(y.s.good)}<span>this year</span>` : y.s.good ? `<b>+${y.s.n}</b>${chip(y.s.good)}` : "<span>no yield on hills</span>";
  const col = (k, label, yieldHtml) => `
    <div class="settle-col" data-c="settle-col">
      <span class="col-head caps">${label}<b class="${y[k].mult > 1 ? "is-raised" : ""}">×${y[k].mult}</b></span>
      ${ico(POP_IC[k], "tile")}
      <span class="col-count num">${s.pops[k]}</span>
      <span class="col-yield">${yieldHtml}</span>
    </div>`;
  const lines = s.built.map((b) => `<li class="settle-line" data-c="settle-line">${ico(BUILDINGS[b].ic, "ui")}${BUILDINGS[b].n}<span>${BUILDINGS[b].fx}</span></li>`).join("");
  return `
    <p class="settle-meta caps" data-c="settle-meta">
      <span class="meta-i">${ico(`settlements/${s.rank}`, "chip")}${s.rank}</span>
      <span class="meta-i">${ico(`terrain/${t.terrain}`, "chip")}${t.terrain}</span>
      <span class="meta-i">${ico("pops/capacity", "chip")}<b>${pops}</b>pops</span>
      <span class="meta-i">${ico("settlements/slot", "chip")}<b>${s.built.length}</b>of ${slots} slots</span>
    </p>
    <div class="settle-cols" data-c="settle-cols">
      ${col("s", "Slaves", slaveYield)}
      ${col("f", "Freemen", `<b>+${y.f.n}</b>${chip("gold")}<span>· eat ${s.pops.f}</span>`)}
      ${col("c", "Citizens", `<b>+${y.c.n}</b>${chip("influence")}<span>· ${s.pops.c} vote${s.pops.c === 1 ? "" : "s"}</span>`)}
    </div>
    <ul class="settle-lines" data-c="settle-lines">${lines}<li class="settle-line" data-c="settle-line">${ico("settlements/slot", "ui")}Build<span><b>${open}</b> slot${open === 1 ? "" : "s"} open</span></li></ul>`;
}

  document.getElementById("realm").innerHTML = `
    <ol class="verbs" data-c="verbs" data-gate-flex aria-label="Verbs">${verbs()}</ol>

      </header>
      <nav class="realm-tabs" role="tablist" data-c="realm-tabs" aria-label="Realm pages">${tabs}<button class="realm-tab is-subject" role="tab" id="subject-tab" aria-selected="true" aria-controls="realm-page" data-c="tab">${ico(`settlements/${s.rank}`, "ui")}<span class="realm-tab-name">${s.name}</span></button></nav>
      <section class="realm-page" id="realm-page" role="tabpanel" aria-labelledby="subject-tab" data-c="realm-page">${settlementPage(s)}</section>

}

/* ------------------------------------------------------------- end turn ---- */
function endturn() {
  TIPS.endturn = { title: "End turn", sub: `${ADVISORY.length} before the table passes`, body: ADVISORY.map(([t, d]) => `${warn(t)}<p class="tip-body">${d}</p>`).join("") };
  const end = document.getElementById("endturn");
  end.setAttribute("aria-label", `End turn, ${ADVISORY.length} advisories`);
  end.innerHTML = `<span class="endturn-disc" data-c="disc">${ico("events/end-turn", "disc")}<span class="endturn-badge" data-c="badge">${ADVISORY.length}</span></span><span class="endturn-label" data-c="chip">End turn</span>`;
}

/* ------------------------------------------------------------- tooltip ---- */
const GAP = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--board-gap"));
const tipEl = document.getElementById("tooltip");
function showTip(host) {
  const t = TIPS[host.dataset.tip]; if (!t) return;
  tipEl.innerHTML = `<div class="tip-title">${t.title}${t.sub ? `<span class="tip-sub">${t.sub}</span>` : ""}</div>${t.body}`;
  tipEl.hidden = false;
  const r = host.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight, gap = GAP();
  const at = host.dataset.tipAt || (r.top > innerHeight / 2 ? "above" : "below");
  const left = Math.min(innerWidth - w - gap, Math.max(gap, r.left + r.width / 2 - w / 2));
  const top = at === "above" ? r.top - h - gap : r.bottom + gap;
  tipEl.style.setProperty("--tip-x", Math.round(left) + "px");
  tipEl.style.setProperty("--tip-y", Math.round(top) + "px");
}
const hideTip = () => { tipEl.hidden = true; };
document.addEventListener("pointerover", (e) => { const h = e.target.closest("[data-tip]"); h ? showTip(h) : hideTip(); });
document.addEventListener("focusin", (e) => { const h = e.target.closest("[data-tip]"); h ? showTip(h) : hideTip(); });
document.addEventListener("focusout", hideTip);

/* --------------------------------------------------------------- board ---- */
const SQ3 = Math.sqrt(3);
const HEX = 100;          /* user units from a hex's centre to a corner */
const unitPos = (q, r) => ({ x: SQ3 * (q + r / 2), y: 1.5 * r });
/* Luxury moorings on sea vertices: three hexes each. The label sits on the sea side;
   "low" drops it below the bottom row's corners. */
const MOORINGS = [[[3, 0], [3, -1], [4, -1], "0", "Marble", "start"], [[0, 3], [1, 2], [1, 3], "1", "Purple Dye", "start"], [[-3, 3], [-2, 3], [-3, 4], null, "Olive Oil", "start", "low"]].map(([a, b, c, owner, name, anchor, low]) => {
  const ps = [a, b, c].map(([q, r]) => unitPos(q, r));
  return { x: ps.reduce((s, p) => s + p.x, 0) / 3 * 1.08, y: ps.reduce((s, p) => s + p.y, 0) / 3 * 1.08, owner, name, anchor, low: !!low };
});
const MOOR_R = 18, MOOR_LX = 26;             /* mooring disc radius, label offset (user units) */
const ROW_BOTTOM = 5.5;                      /* the bottom row's lowest corner (hex units) */
const POPS_BASE = 16, GLYPH_W = 18;          /* the pop count's base size; a pop glyph is 24 × .75 */
function renderBoard() {
  const svg = document.getElementById("board");
  const pts = Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 180 * (60 * i - 30); return `${(Math.cos(a) * HEX).toFixed(1)},${(Math.sin(a) * HEX).toFixed(1)}`; }).join(" ");
  const shape = (x, cls) => x.kind === "path" ? `<path class="${cls}" d="${x.d}"/>` : x.kind === "circle" ? `<circle class="${cls}" cx="${x.cx}" cy="${x.cy}" r="${x.r}"/>` : `<rect class="${cls}" x="${x.x}" y="${x.y}" width="${x.w}" height="${x.h}"/>`;
  /* board symbols are the same rasters as the chrome, in the glyphs' 24-unit box */
  const popset = (ic, n) => `<g class="popset"><g class="popset-glyph"><image href=${JSON.stringify(`../icons/${ic}.png`)} width="24" height="24"/></g><text class="pops">${n}</text></g>`;
  const tiles = TILES.map((t) => {
    const p = unitPos(t.q, t.r); const s = settleAt(t.id);
    const pipN = t.terrain === "oracle" ? 0 : s && SLOTS[s.rank] ? SLOTS[s.rank] : t.slots; const built = s ? s.built.length : 0;
    const pips = `<g class="pips">${Array.from({ length: pipN }, (_, i) => `<circle class="pip ${i < built ? "built" : ""}" cx="${(i - (pipN - 1) / 2) * 16}" cy="0" r="5"/>`).join("")}</g>`;
    let settle = "", tip = "";
    if (s) {
      const [, tok] = GLAZE[s.owner];
      TIPS["tile-" + t.id] = { title: s.name, sub: `${NAMES[s.owner]} · ${s.rank}`, body: ledger(censusRows(s.pops)) };
      tip = ` data-tip="tile-${t.id}"`;
      settle = `<g class="settle" style="--owner:var(--${tok})"><g transform="translate(0,-32)"><circle class="seal-disc ${s.rank}" r="28"/><image href=${JSON.stringify(`../icons/settlements/${s.rank}.png`)} x="-20" y="-20" width="40" height="40"/></g>`
        + `<rect class="plate" rx="1"/><text class="plate-text">${s.name}</text>`
        + `<g class="pops-split">${popset(POP_IC.s, s.pops.s)}${popset(POP_IC.f, s.pops.f)}${popset(POP_IC.c, s.pops.c)}</g>`
        + `<g class="pops-total">${popset("pops/crowd", s.pops.s + s.pops.f + s.pops.c)}</g></g>`;
    }
    const emblem = s ? "" : `<image class="emblem" href=${JSON.stringify(`../icons/terrain/${t.terrain}.png`)} x="-24" y="-40" width="48" height="48"/>`;
    const own = s ? ` owned" style="--owner:var(--${GLAZE[s.owner][1]})` : "";
    return `<g class="tile-btn${t.id === SUBJECT ? " is-selected" : ""}" data-tile="${t.id}"${tip} transform="translate(${(p.x * HEX).toFixed(1)},${(p.y * HEX).toFixed(1)})"><polygon class="tile ${t.terrain}${own}" points="${pts}"/>${emblem}${settle}${pips}</g>`;
  });
  const moorings = MOORINGS.map((m, i) => {
    TIPS["moor-" + i] = tipText(m.name, m.owner ? `Claimed by ${NAMES[m.owner]}.` : "Unclaimed. A Port on an adjacent settlement claims it.", "Luxury mooring");
    return `<g class="moor" data-tip="moor-${i}" transform="translate(${(m.x * HEX).toFixed(1)},${(m.y * HEX).toFixed(1)})"${m.owner ? ` style="--owner:var(--${GLAZE[m.owner][1]})"` : ""}><circle class="mooring${m.owner ? " claimed" : ""}" r="${MOOR_R}"/><g transform="translate(-11,-11) scale(.92)">${GL.luxury.map((x) => shape(x, "popg")).join("")}</g><text class="mooring-name" x="${m.anchor === "end" ? -MOOR_LX : MOOR_LX}" text-anchor="${m.anchor}">${m.name}</text></g>`;
  }).join("");
  const hw = 3.5 * SQ3 * HEX, hh = 5.5 * HEX;
  svg.setAttribute("viewBox", `${-hw} ${-hh} ${hw * 2} ${hh * 2}`);
  svg.innerHTML = `<g>${tiles.join("")}${moorings}</g>`;
}

/* Board text keeps a 12px floor on screen, so at a small hex it grows in user units.
   k is that growth for the pop counts (the smallest text); the label stack follows it. */
const floorPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--b-floor"));
const kOf = (s) => Math.max(1, floorPx() / (POPS_BASE * s / HEX));
/* Three pop counts need the hex's width at their row; below that the tile shows one total. */
function compactOf(s) {
  const k = kOf(s), plateH = 1.45 * Math.max(18, floorPx() * HEX / s);
  const rowBottom = 4 + plateH + 6 + GLYPH_W * k;
  const halfW = HEX * SQ3 / 2 * (rowBottom <= HEX / 2 ? 1 : (HEX - rowBottom) / (HEX / 2));
  return 60 * k + 4 > halfW;
}
/* Lay the labels out from the font sizes the stylesheet resolved for this scale. */
function layoutLabels(s) {
  const board = document.getElementById("board");
  const fs = (el) => parseFloat(getComputedStyle(el).fontSize);
  board.classList.toggle("is-compact", compactOf(s));
  const place = (set, x, top, k) => {
    set.querySelector(".popset-glyph").setAttribute("transform", `translate(${x - 20 * k},${top}) scale(${0.75 * k})`);
    const t = set.querySelector(".pops"); t.setAttribute("x", x + 8 * k); t.setAttribute("y", top + 14 * k);
  };
  for (const g of board.querySelectorAll(".settle")) {
    const text = g.querySelector(".plate-text"), plate = g.querySelector(".plate");
    const f = fs(text), h = 1.45 * f, w = text.getComputedTextLength() + 1.3 * f;
    plate.setAttribute("x", -w / 2); plate.setAttribute("y", 4); plate.setAttribute("width", w); plate.setAttribute("height", h);
    text.setAttribute("y", 4 + h / 2 + 0.35 * f);
    const k = fs(g.querySelector(".pops")) / POPS_BASE, top = 4 + h + 6;
    g.querySelectorAll(".pops-split .popset").forEach((set, i) => place(set, (i - 1) * 40 * k, top, k));
    place(g.querySelector(".pops-total .popset"), 0, top, k);
    g.parentNode.querySelector(".pips").setAttribute("transform", `translate(0,${top + GLYPH_W * k + 6 + 5})`);
  }
  for (const pips of board.querySelectorAll(".tile-btn:not(:has(.settle)) .pips")) pips.setAttribute("transform", "translate(0,72)");
  board.querySelectorAll(".mooring-name").forEach((t, i) => {
    const f = fs(t), m = MOORINGS[i];
    t.setAttribute("y", m.low ? (ROW_BOTTOM - m.y) * HEX + 2 + 0.72 * f : 0.35 * f);
  });
}

/* Fit the island against the chrome's exclusion rectangles: the largest hex size
   whose 37 tiles and 3 moorings clear every [data-exclude] box by one spacing
   step (--board-gap), then the free centre nearest the viewport's middle. The
   size is found to a sixteenth of a pixel, so no chrome-free height goes unused. */
function fitBoard() {
  const W = innerWidth, H = innerHeight, M = GAP();
  const rects = [...document.querySelectorAll("[data-exclude]")].map((e) => e.getBoundingClientRect()).filter((r) => r.width > 0 && r.height > 0);
  const tileBoxes = TILES.map((t) => { const p = unitPos(t.q, t.r); return [p.x - SQ3 / 2, p.x + SQ3 / 2, p.y - 1, p.y + 1]; });
  const HW = 3.5 * SQ3, HH = 5.5;
  /* a mooring's box: its disc, plus its label when the hex is large enough to carry one */
  function mooringBoxes(s) {
    if (compactOf(s)) return MOORINGS.map((m) => [m.x - 0.2, m.x + 0.2, m.y - 0.2, m.y + 0.2]);
    const f = Math.max(16, floorPx() * HEX / s);
    return MOORINGS.map((m) => {
      const len = (MOOR_LX + 0.6 * f * m.name.length) / HEX;
      const y1 = m.low ? ROW_BOTTOM + (2 + 0.95 * f) / HEX : m.y + 0.2;
      return m.anchor === "end" ? [m.x - len, m.x + 0.2, m.y - 0.2, y1] : [m.x - 0.2, m.x + len, m.y - 0.2, y1];
    });
  }
  /* the free centre for hex size s, or null */
  function centre(s) {
    const boxes = tileBoxes.concat(mooringBoxes(s));
    /* the island's extent, labels included, must stay on screen */
    const ext = (i, pick) => pick(...boxes.map((x) => x[i]));
    const cyMin = Math.ceil(-ext(2, Math.min) * s + M), cyMax = Math.floor(H - ext(3, Math.max) * s - M); if (cyMin > cyMax) return null;
    const mid = Math.round((cyMin + cyMax) / 2);
    for (let d = 0; d <= cyMax - cyMin; d++) {
      for (const cy of d ? [mid - d, mid + d] : [mid]) {
        if (cy < cyMin || cy > cyMax) continue;
        const bans = [];
        for (const [x0, x1, y0, y1] of boxes) for (const r of rects) if (cy + y0 * s < r.bottom + M && cy + y1 * s > r.top - M) bans.push([r.left - M - x1 * s, r.right + M - x0 * s]);
        const lo = Math.ceil(-ext(0, Math.min) * s + M), hi = Math.floor(W - ext(1, Math.max) * s - M);
        const want = Math.min(hi, Math.max(lo, W / 2));
        const cands = [want, ...bans.flat().map(Math.ceil), ...bans.flat().map(Math.floor)];
        let best = null;
        for (const c of cands) {
          if (c < lo || c > hi || bans.some(([a, b]) => c > a && c < b)) continue;
          if (best === null || Math.abs(c - want) < Math.abs(best - want)) best = c;
        }
        if (best !== null) return [best, cy];
      }
    }
    return null;
  }
  const sMax = Math.floor(Math.min((H - 2 * M) / (2 * HH), (W - 2 * M) / (2 * HW)));
  for (let s = sMax; s >= 16; s--) {
    if (!centre(s)) continue;
    let fit = s;
    for (let f = s + 1 - 1 / 16; f > s; f -= 1 / 16) if (centre(f)) { fit = f; break; }
    const [cx, cy] = centre(fit);
    BASE = { s: fit, cx, cy };
    resetView();
    return applyView();
  }
}

function placeBoard(s, cx, cy) {
  const HW = 3.5 * SQ3, HH = 5.5;
  const b = document.getElementById("board").style;
  b.setProperty("--board-w", (2 * HW * s).toFixed(1) + "px");
  b.setProperty("--board-h", (2 * HH * s).toFixed(1) + "px");
  b.setProperty("--board-x", (cx - HW * s).toFixed(1) + "px");
  b.setProperty("--board-y", (cy - HH * s).toFixed(1) + "px");
  b.setProperty("--b-scale", (s / HEX).toFixed(4));
  layoutLabels(s);
}

/* ---------------------------------------------------------------- the map --
   The island is a canvas. Drag the sea or the island to pan; wheel or pinch to
   zoom about the pointer. fitBoard's fit is the opening view, and a resize or
   the 0 key returns to it. */
let BASE = null;
const VIEW = { x: 0, y: 0, z: 1 };
const Z_MIN = 0.6, Z_MAX = 2.5;
function resetView() { VIEW.x = 0; VIEW.y = 0; VIEW.z = 1; }
function applyView() {
  if (!BASE) return;
  /* the island's centre never leaves the screen */
  const cx = Math.min(innerWidth, Math.max(0, BASE.cx + VIEW.x));
  const cy = Math.min(innerHeight, Math.max(0, BASE.cy + VIEW.y));
  VIEW.x = cx - BASE.cx;
  VIEW.y = cy - BASE.cy;
  placeBoard(BASE.s * VIEW.z, cx, cy);
}
(function wireMap() {
  const board = document.getElementById("board");
  const onMap = (t) => t === document.body || t === document.documentElement || board.contains(t);
  let drag = null;
  addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || !onMap(e.target)) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, vx: VIEW.x, vy: VIEW.y, moved: false };
  });
  addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) { drag.moved = true; document.body.classList.add("is-panning"); hideTip(); }
    VIEW.x = drag.vx + dx;
    VIEW.y = drag.vy + dy;
    applyView();
  });
  const end = (e) => { if (drag && e.pointerId === drag.id) { drag = null; document.body.classList.remove("is-panning"); } };
  addEventListener("pointerup", end);
  addEventListener("pointercancel", end);
  addEventListener("wheel", (e) => {
    if (!BASE || !onMap(e.target)) return;
    e.preventDefault();
    const z = Math.min(Z_MAX, Math.max(Z_MIN, VIEW.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))));
    const k = z / VIEW.z;
    const cx = BASE.cx + VIEW.x, cy = BASE.cy + VIEW.y;
    VIEW.x += (e.clientX - cx) * (1 - k);
    VIEW.y += (e.clientY - cy) * (1 - k);
    VIEW.z = z;
    applyView();
  }, { passive: false });
  addEventListener("keydown", (e) => {
    if (e.key !== "0" || e.target.closest("input, textarea")) return;
    resetView();
    applyView();
  });
})();

/* ------------------------------------------------------------ verb fans --
   Where a fan opens: sub-circles on an arc around its centre, aimed at the
   island's centre (a second fan: straight out from the disc through its
   option). The arc may turn up to a right angle either way and widen; the
   cheapest placement wins in which no circle or label leaves the screen,
   overlaps another, or touches a disc, a disc's name (as the open hint), the
   realm, the bar, the ticker or the end turn. A second fan also keeps clear of every circle
   and label of the first, so its peers stay in reach. */
const token = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
const FAN_AT = new WeakMap(); /* an open option's circle centre, viewport px */
function fanShapes(item, d) {
  const lab = item.querySelector(":scope > .fan-btn .fan-label");
  return [[-d / 2, -d / 2, d / 2, d / 2], [-lab.offsetWidth / 2, lab.offsetTop - d / 2, lab.offsetWidth / 2, lab.offsetTop - d / 2 + lab.offsetHeight]];
}
function placeFan(host) {
  const items = [...host.querySelector(":scope > .fan").children];
  const n = items.length;
  const d = items[0].querySelector(":scope > .fan-btn .fan-disc").offsetWidth;
  const gap = GAP();
  const shapes = items.map((it) => fanShapes(it, d));
  const chord = Math.max(d, ...shapes.map((sh) => sh[1][2] - sh[1][0])) + gap;
  const verb = host.closest(".verb");
  const disc = verb.getBoundingClientRect();
  const dx = disc.left + disc.width / 2;
  const dy = disc.top + disc.height / 2;
  const second = host !== verb;
  const [cx, cy] = second ? FAN_AT.get(host) : [dx, dy];
  const isle = document.getElementById("board").getBoundingClientRect();
  const aim = second ? Math.atan2(cy - dy, cx - dx) : Math.atan2(isle.top + isle.height / 2 - cy, isle.left + isle.width / 2 - cx);
  const pad = (r) => ({ l: r.left - gap, t: r.top - gap, r: r.right + gap, b: r.bottom + gap });
  const walls = [...document.querySelectorAll(".verb-disc, .verb-name, #topbar, #ticker, #realm, #endturn")].map((el) => pad(el.getBoundingClientRect()));
  /* the open disc's plate will read as its hint: wall off the wider of the two */
  const plate = verb.querySelector(".verb-name").getBoundingClientRect();
  const hintW = verb.querySelector(".verb-name-p").offsetWidth + 2 * gap;
  walls.push(pad({ left: dx - hintW / 2, right: dx + hintW / 2, top: plate.top, bottom: plate.bottom }));
  if (second)
    for (const peer of host.parentElement.children)
      for (const [l, t, r, b] of fanShapes(peer, d)) {
        const [px, py] = FAN_AT.get(peer);
        walls.push(pad({ left: px + l, top: py + t, right: px + r, bottom: py + b }));
      }
  const hit = (a, z) => a.l < z.r && a.r > z.l && a.t < z.b && a.b > z.t;
  const boxes = ([x, y], k) => shapes[k].map(([l, t, r, b]) => ({ l: x + l, t: y + t, r: x + r, b: y + b }));
  const onScreen = (q) => q.l >= gap && q.t >= gap && q.r <= innerWidth - gap && q.b <= innerHeight - gap;
  /* cost: one degree of turn weighs as much as two pixels of radius */
  const rho0 = (second ? d : disc.width) / 2 + gap + d / 2;
  let best = null;
  for (let rho = rho0; rho < rho0 + innerHeight / 2; rho += gap) {
    const step = n > 1 ? 2 * Math.asin(Math.min(1, chord / (2 * rho))) : 0;
    for (let t = -90; t <= 90; t += 5) {
      const cost = Math.abs(t) + (rho - rho0) / 2;
      if (best && cost >= best.cost) continue;
      const a0 = aim + (t * Math.PI) / 180 - (step * (n - 1)) / 2;
      const ps = items.map((_, k) => [cx + rho * Math.cos(a0 + k * step), cy + rho * Math.sin(a0 + k * step)]);
      const bs = ps.map(boxes);
      const ok = bs.every((qs, k) => qs.every((q) => onScreen(q) && !walls.some((z) => hit(q, z)) && bs.every((os, j) => j === k || os.every((o) => !hit(q, o)))));
      if (ok) best = { cost, ps };
    }
  }
  (best ? best.ps : items.map(() => [cx, cy])).forEach(([x, y], k) => {
    const fx = Math.round(x - cx);
    const fy = Math.round(y - cy);
    items[k].style.setProperty("--fx", `${fx}px`);
    items[k].style.setProperty("--fy", `${fy}px`);
    FAN_AT.set(items[k], [cx + fx, cy + fy]);
  });
}

/* A fan opens after --fan-dwell of hover on its disc, or on its option for a
   second fan, and closes --fan-linger after the pointer has left both; the
   second fan is inside its option, so crossing into it never shuts it. A disc
   click runs the group's `click` option, or opens the fan. Choosing an option
   that holds a second fan opens it. Enter or ArrowUp on a disc opens its fan
   and moves focus in; arrows walk a fan, Enter opens a second fan, Escape
   backs out one level. Hotkeys 1 to 6 act as a click. The mock only
   announces the verb. */
const runVerb = (id) => document.dispatchEvent(new CustomEvent("verb", { detail: id }));
function wireVerbs() {
  const dwell = token("--fan-dwell");
  const linger = token("--fan-linger");
  const lis = [...document.querySelectorAll(".verb")];
  const btnOf = (host) => host.querySelector(":scope > .verb-btn, :scope > .fan-btn");
  const fanOf = (host) => host.querySelector(":scope > .fan");
  const itemsOf = (host) => [...fanOf(host).querySelectorAll(":scope > .fan-item > .fan-btn")];
  const isOpen = (host) => host.classList.contains("is-open");
  const cancel = new WeakMap();
  const setOpen = (host, open) => {
    if (open === isOpen(host)) return;
    if (open) {
      const peers = host.classList.contains("verb") ? lis : [...host.parentElement.children];
      peers.forEach((o) => o !== host && setOpen(o, false));
      placeFan(host);
    } else {
      host.querySelectorAll(".fan-item.is-open").forEach((o) => setOpen(o, false));
    }
    host.classList.toggle("is-open", open);
    btnOf(host).setAttribute("aria-expanded", String(open));
  };
  /* every host of a fan (a disc, or an option holding a second fan) */
  for (const host of [...lis, ...document.querySelectorAll(".fan-item")].filter(fanOf)) {
    let openT = 0;
    let closeT = 0;
    host.addEventListener("pointerenter", () => {
      clearTimeout(closeT);
      if (!isOpen(host)) openT = setTimeout(() => setOpen(host, true), dwell);
    });
    host.addEventListener("pointerleave", () => {
      clearTimeout(openT);
      closeT = setTimeout(() => setOpen(host, false), linger);
    });
    cancel.set(host, () => clearTimeout(openT));
  }
  for (const li of lis) {
    const g = GROUPS[li.dataset.group];
    const btn = btnOf(li);
    btn.addEventListener("click", () => {
      cancel.get(li)();
      if (!g.click) return setOpen(li, !isOpen(li));
      setOpen(li, false);
      if (!li.classList.contains("is-short")) runVerb(g.click);
    });
    btn.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== "ArrowUp") return;
      e.preventDefault();
      setOpen(li, true);
      itemsOf(li)[0].focus();
    });
    li.addEventListener("focusout", (e) => {
      if (!li.contains(e.relatedTarget)) setOpen(li, false);
    });
  }
  for (const f of document.querySelectorAll(".fan")) {
    const host = f.parentElement;
    const own = (e) => e.target.closest(".fan") === f;
    f.addEventListener("keydown", (e) => {
      const move = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!move || !own(e)) return;
      e.preventDefault();
      const its = itemsOf(host);
      its[(its.indexOf(document.activeElement) + move + its.length) % its.length].focus();
      f.querySelectorAll(":scope > .fan-item.is-open").forEach((o) => setOpen(o, false));
    });
    f.addEventListener("click", (e) => {
      const b = e.target.closest(".fan-btn");
      if (!b || !own(e)) return;
      const item = b.parentElement;
      if (fanOf(item)) {
        cancel.get(item)();
        setOpen(item, true);
        if (e.detail === 0) itemsOf(item)[0].focus();
        return;
      }
      if (b.getAttribute("aria-disabled") === "true") return;
      const li = f.closest(".verb");
      setOpen(li, false);
      btnOf(li).focus();
      runVerb(b.dataset.verb);
    });
  }
  document.addEventListener("pointerdown", (e) => lis.forEach((li) => !li.contains(e.target) && setOpen(li, false)));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      const li = lis.find(isOpen);
      if (!li) return;
      const host = li.querySelector(".fan-item.is-open") || li;
      setOpen(host, false);
      btnOf(host).focus();
      return;
    }
    const li = lis[Number(e.key) - 1];
    if (li && !e.altKey && !e.ctrlKey && !e.metaKey && !e.repeat) btnOf(li).click();
  });
  addEventListener("resize", () => lis.forEach((li) => setOpen(li, false)));
}

/* -------------------------------------------------------------- render ---- */
computeIncome();
topbar(); ticker(); realm(); endturn(); wireVerbs(); renderBoard(); fitBoard();
addEventListener("resize", fitBoard);
document.fonts && document.fonts.ready.then(fitBoard);
</script>
</body>
</html>
