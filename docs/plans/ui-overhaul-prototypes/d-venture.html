<meta charset="utf-8">
<title>Hegemony — the die is cast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto.css">
<style>
  .scene {
    width: 1440px; height: 900px; position: relative; overflow: hidden;
    background: url("/assets/map/aegean-sea-board.png") center / cover no-repeat;
  }
  .scene::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgb(24 18 16 / 0.6), rgb(24 18 16 / 0.9)); }
  .stage { position: absolute; inset: 0; display: grid; place-items: center; }

  .tablet-v {
    width: 560px; background: linear-gradient(180deg, #f8eed6, var(--bone) 55%);
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%, 0 16px);
    box-shadow: 0 4px 0 #c9b48c, 0 34px 90px rgb(0 0 0 / 0.65);
    padding: 26px 34px 26px; text-align: center;
  }
  .tablet-v .kicker { font-family: Cinzel, serif; font-size: 10.5px; letter-spacing: 0.3em; color: var(--clay); }
  .tablet-v h1 { font-family: Cinzel, serif; font-size: 27px; font-weight: 700; letter-spacing: 0.1em; margin: 3px 0 1px; }
  .tablet-v .flavor { font-size: 14.5px; font-style: italic; color: var(--ink-66); margin-bottom: 16px; }

  .drama { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 18px; }
  .die {
    width: 84px; height: 84px; border-radius: 12px; flex: none;
    background: linear-gradient(160deg, #2d221a, var(--lacquer) 70%);
    box-shadow: inset 0 1px 0 rgb(255 248 231 / 0.2), 0 10px 26px rgb(0 0 0 / 0.5), 0 0 46px rgb(217 138 53 / 0.4);
    display: grid; place-items: center; position: relative;
  }
  .die .pips { display: grid; grid-template-columns: repeat(3, 14px); grid-template-rows: repeat(3, 14px); gap: 6px; }
  .die .pips i { width: 14px; height: 14px; border-radius: 50%; background: var(--ivory); box-shadow: inset 0 -2px 3px rgb(0 0 0 / 0.4); }
  .die .pips i.off { visibility: hidden; }
  .outcome { text-align: left; }
  .outcome .k { font-family: Cinzel, serif; font-size: 11px; letter-spacing: 0.24em; color: var(--ink-48); }
  .outcome h2 { font-family: Cinzel, serif; font-size: 23px; font-weight: 700; letter-spacing: 0.06em; margin: 1px 0 3px; }
  .outcome .gain { display: flex; align-items: center; gap: 8px; font-size: 38px; font-weight: 800; color: var(--pos); line-height: 1; }
  .outcome .gain .ci { width: 30px; height: 30px; }

  table.dtable { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  .dtable td { padding: 8px 10px; border-top: 1px solid var(--ink-12); font-size: 15px; text-align: left; }
  .dtable td.d { width: 44px; font-weight: 800; font-size: 17px; text-align: center;
    font-family: Alegreya, serif; color: var(--ink-66); }
  .dtable td.r { text-align: right; font-weight: 800; white-space: nowrap; }
  .dtable td.r .up { color: var(--pos); } .dtable td.r .dash { color: var(--ink-30); }
  .dtable tr.dim { opacity: 0.42; }
  .dtable tr.hit td { background: rgb(192 70 28 / 0.13); border-top-color: rgb(192 70 28 / 0.5); }
  .dtable tr.hit td:first-child { box-shadow: inset 3px 0 0 var(--clay); }
  .dtable tr.hit td.d { color: var(--clay); font-size: 20px; }

  .go-row { display: flex; gap: 12px; }
  .continue {
    flex: 1; border: none; cursor: pointer; border-radius: 4px;
    background: linear-gradient(180deg, #cd5124, var(--clay) 55%, #a93c17);
    color: var(--ivory); font-family: Cinzel, serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em;
    padding: 14px 0; box-shadow: inset 0 1px 0 rgb(255 248 231 / 0.35), 0 3px 10px rgb(0 0 0 / 0.45);
  }
</style>

<div class="scene">
  <div class="stage">
    <div class="tablet-v">
      <div class="kicker">VENTURE · DAMON STAKES 5 GOLD</div>
      <h1>MERCHANT CONVOY</h1>
      <div class="flavor">“Amphorae for the Tyrrhenian markets — if the sea allows.”</div>

      <div class="drama num">
        <div class="die">
          <div class="pips">
            <i></i><i class="off"></i><i></i>
            <i></i><i class="off"></i><i></i>
            <i></i><i class="off"></i><i></i>
          </div>
        </div>
        <div class="outcome">
          <div class="k">THE TABLE SPEAKS</div>
          <h2>RICH CARGO RETURNS</h2>
          <div class="gain">+9 <i class="ci" style="--m:url('/assets/resource-icons/gold-mask.png')"></i></div>
        </div>
      </div>

      <table class="dtable num">
        <tr class="dim"><td class="d">1</td><td>Lost at sea</td><td class="r"><span class="dash">—</span></td></tr>
        <tr class="dim"><td class="d">2</td><td>Pirates take the cargo</td><td class="r"><span class="dash">—</span></td></tr>
        <tr class="dim"><td class="d">3</td><td>Modest profits</td><td class="r"><span class="up">+5 gold</span></td></tr>
        <tr class="dim"><td class="d">4</td><td>Modest profits</td><td class="r"><span class="up">+5 gold</span></td></tr>
        <tr class="dim"><td class="d">5</td><td>Rich cargo returns</td><td class="r"><span class="up">+9 gold</span></td></tr>
        <tr class="hit"><td class="d">6</td><td><b>Rich cargo returns</b></td><td class="r"><span class="up">+9 gold</span></td></tr>
      </table>

      <div class="go-row">
        <button class="continue">TAKE THE GOLD</button>
      </div>
    </div>
  </div>
</div>
