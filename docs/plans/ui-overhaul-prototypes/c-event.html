<meta charset="utf-8">
<title>Hegemony — a dark fate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto.css">
<style>
  .scene {
    width: 1440px; height: 900px; position: relative; overflow: hidden;
    background: url("/assets/map/aegean-sea-board.png") center / cover no-repeat;
  }
  .scene::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 42%, rgb(24 18 16 / 0.68), rgb(24 18 16 / 0.93)); }

  .stage { position: absolute; inset: 0; display: grid; place-items: center; }

  .fate-card {
    width: 470px; border-radius: 6px; overflow: hidden; text-align: center; position: relative;
    background: linear-gradient(180deg, #fffaf0, var(--ivory) 50%, #f3e7cb);
    box-shadow: 0 0 0 1px rgb(36 25 16 / 0.55), 0 0 0 5px rgb(143 46 19 / 0.85), 0 0 0 6.5px rgb(36 25 16 / 0.6),
      0 42px 110px rgb(0 0 0 / 0.75), 0 0 120px rgb(143 46 19 / 0.28);
  }
  .fate-card .art { position: relative; height: 300px; }
  .fate-card .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fate-card .art::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgb(36 25 16 / 0.22), transparent 30%, transparent 62%, rgb(255 248 231 / 0.94) 96%); }
  .fate-card .seat-tag { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 8px;
    background: rgb(24 18 16 / 0.78); border-radius: 20px; padding: 5px 13px 5px 6px; z-index: 2; }
  .fate-card .seat-tag .glaze { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    background: var(--melichron); color: var(--ivory); font-family: Cinzel, serif; font-weight: 700; font-size: 11px;
    box-shadow: inset 0 0 0 1.4px rgb(255 248 231 / 0.85); }
  .fate-card .seat-tag span { color: var(--ivory); font-family: Cinzel, serif; font-size: 11px; letter-spacing: 0.14em; }

  .fate-card .body { padding: 0 34px 26px; margin-top: -26px; position: relative; z-index: 2; }
  .fate-card .kicker { font-family: Cinzel, serif; font-size: 10.5px; letter-spacing: 0.34em; color: var(--neg); }
  .fate-card h1 { font-family: Cinzel, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.06em; margin: 4px 0 2px; }
  .fate-card .flavor { font-size: 15px; font-style: italic; color: var(--ink-66); margin-bottom: 15px; }

  .blow {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: rgb(143 46 19 / 0.1); border-top: 1px solid rgb(143 46 19 / 0.4); border-bottom: 1px solid rgb(143 46 19 / 0.4);
    padding: 13px 0; margin-bottom: 6px;
  }
  .blow svg { width: 30px; height: 30px; stroke: var(--neg); fill: none; stroke-width: 2; stroke-linecap: round; }
  .blow .n { font-size: 34px; font-weight: 800; color: var(--neg); line-height: 1; }
  .blow .what { text-align: left; line-height: 1.15; }
  .blow .what b { font-family: Cinzel, serif; font-size: 13px; letter-spacing: 0.1em; color: var(--neg); display: block; }
  .blow .what span { font-size: 12.5px; color: var(--ink-66); }

  .turns { display: flex; justify-content: center; gap: 7px; margin: 12px 0 18px; }
  .turns i { width: 26px; height: 8px; border-radius: 4px; background: var(--neg); opacity: 0.9; }
  .turns i + i { opacity: 0.55; } .turns i + i + i { opacity: 0.3; }
  .turns .cap { font-size: 11.5px; color: var(--ink-48); align-self: center; font-style: italic; }

  .endure {
    width: 100%; border: none; cursor: pointer; border-radius: 4px;
    background: linear-gradient(180deg, #a83a1c, var(--neg) 60%, #6e2410);
    color: var(--ivory); font-family: Cinzel, serif; font-weight: 700; font-size: 16px; letter-spacing: 0.2em;
    padding: 15px 0; box-shadow: inset 0 1px 0 rgb(255 248 231 / 0.3), 0 3px 12px rgb(0 0 0 / 0.5);
  }

  .deck-echo { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center;
    color: var(--ivory-45); font-family: Cinzel, serif; font-size: 11px; letter-spacing: 0.28em; }
</style>

<div class="scene">
  <div class="stage">
    <div class="fate-card">
      <div class="art">
        <div class="seat-tag"><span class="glaze">Ν</span><span>NIKOS DRAWS</span></div>
        <img src="/assets/event-cards/season-drought.webp" alt="">
      </div>
      <div class="body">
        <div class="kicker">A DARK FATE</div>
        <h1>CIVIL DISCORD</h1>
        <div class="flavor">“The wells crack. The assembly mutters.”</div>
        <div class="blow num">
          <svg viewBox="0 0 24 24"><path d="M4 5c2.5 1.2 5.2 1.8 8 1.8S17.5 6.2 20 5v6c0 5-3.5 8.5-8 8.5S4 16 4 11zM8.5 11.5l2 1.2m5-1.2-2 1.2M8 16.5c1.2-1.3 2.5-2 4-2s2.8.7 4 2"/></svg>
          <span class="n">−2</span>
          <div class="what"><b>HAPPINESS</b><span>at each of your upkeeps</span></div>
        </div>
        <div class="turns"><i></i><i></i><i></i><span class="cap">three turns</span></div>
        <button class="endure">ENDURE IT</button>
      </div>
    </div>
  </div>
  <div class="deck-echo">THE DECK OF FATES · 67 REMAIN</div>
</div>
